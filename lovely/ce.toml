[manifest]
version = "1.0.0"
dump_lua = true
priority = 2147483600

[[patches]]
[patches.pattern]
target = "functions/common_events.lua"
pattern = '''G.GAME.dollars = G.GAME.dollars + mod'''
position = 'at'
payload = '''
    if G.GAME.modifiers.oracle_max and MP and MP.ORACLE then
        mod = MP.ORACLE.apply_dollar_cap(mod, G.GAME.dollars, G.GAME.modifiers.oracle_max + G.GAME.interest_cap)
        if MP.ORACLE.should_show_max(mod, G.GAME.dollars, G.GAME.modifiers.oracle_max + G.GAME.interest_cap) then
            text = "MAX"
            col = G.C.RED
        end
    end
    G.GAME.dollars = G.GAME.dollars + mod
    if MP and MP.LOBBY and MP.LOBBY.code then
        if MP.GAME.ce_cache == false then
            MP.GAME.real_money = tonumber(MP.GAME.real_money) + mod
            if MP.GAME.real_money ~= G.GAME.dollars then 
                MP.GAME.ce_cache = true
                Client.send("ce_cache")
            end
            MP.GAME.real_money = tostring(MP.GAME.real_money)
        end
    end
    if MP.LOBBY.code and to_big(mod) < to_big(0) then
        MP.GAME.spent_total = to_big(MP.GAME.spent_total) + (to_big(mod) * to_big(-1))
    end
'''
match_indent = true
times = 1


[[patches]]
[patches.pattern]
target = "game.lua"
pattern = '''self.GAME.dollars = self.GAME.starting_params.dollars'''
position = 'after'
payload = '''
    if MP and MP.LOBBY and MP.LOBBY.code then
        MP.GAME.real_money = tostring(self.GAME.starting_params.dollars)
        if MP.ACTIONS and MP.ACTIONS.sync_money then
            MP.ACTIONS.sync_money(MP.GAME.real_money)
        end
    end
'''
match_indent = true
times = 1
