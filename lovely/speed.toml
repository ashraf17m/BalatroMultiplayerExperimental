[manifest]
version = "1.0.0"
dump_lua = true
priority = 100

[[patches]]
[patches.pattern]
target = "functions/UI_definitions.lua"
pattern = "create_option_cycle({label = localize('b_set_gamespeed'),scale = 0.8, options = {0.5, 1, 2, 4}, opt_callback = 'change_gamespeed', current_option = (G.SETTINGS.GAMESPEED == 0.5 and 1 or G.SETTINGS.GAMESPEED == 4 and 4 or G.SETTINGS.GAMESPEED + 1)}),"
position = "after"
match_indent = true
payload = '''create_option_cycle({label = "Speed Multiplier", scale = 0.8, options = {1, 2, 4, 8, 16}, opt_callback = 'change_mp_speed', current_option = (G.SETTINGS.mp_speed == 2 and 2 or G.SETTINGS.mp_speed == 4 and 3 or G.SETTINGS.mp_speed == 8 and 4 or G.SETTINGS.mp_speed == 16 and 5 or 1)}),'''

[[patches]]
[patches.pattern]
target = "functions/button_callbacks.lua"
pattern = "G.FUNCS.change_gamespeed = function(args)"
position = "before"
match_indent = true
payload = '''
G.FUNCS.change_mp_speed = function(args)
  G.SETTINGS.mp_speed = args.to_val
  if G.save_settings then G:save_settings() end
end
'''

[[patches]]
[patches.pattern]
target = "game.lua"
pattern = "self.SPEEDFACTOR = (G.STAGE == G.STAGES.RUN and not G.SETTINGS.paused and not G.screenwipe) and self.SETTINGS.GAMESPEED or 1"
position = "after"
match_indent = true
payload = '''
if (G.STAGE == G.STAGES.RUN and not G.SETTINGS.paused and not G.screenwipe) then
    self.SPEEDFACTOR = self.SPEEDFACTOR * ((G.SETTINGS and G.SETTINGS.mp_speed) or 1)
end'''

[[patches]]
[patches.pattern]
target = "engine/event.lua"
pattern = '''for k, v in pairs(self.queues) do
    local blocked = false
    local i=1'''
position = "at"
match_indent = true
payload = '''for k, v in pairs(self.queues) do
    local blocked = false
    local consecutive_completed = 0
    local max_consecutive = (G.SETTINGS and G.SETTINGS.mp_speed and G.SETTINGS.mp_speed > 1) and (math.floor(G.SETTINGS.mp_speed) - 1) or 0
    local i=1'''

[[patches]]
[patches.pattern]
target = "engine/event.lua"
pattern = '''if results.completed and results.time_done then
    table.remove(v, i)
else'''
position = "at"
match_indent = true
payload = '''if results.completed and results.time_done then
    table.remove(v, i)
    if consecutive_completed < max_consecutive then
        consecutive_completed = consecutive_completed + 1
        blocked = false
    end
else'''
